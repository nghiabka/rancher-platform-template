services:
  rancher:
    image: rancher/rancher:${RANCHER_VERSION:-stable}
    container_name: rancher
    restart: unless-stopped
    privileged: true
    ports:
      - "${RANCHER_HTTP_PORT:-80}:80"
      - "${RANCHER_HTTPS_PORT:-443}:443"
    volumes:
      - rancher-data:/var/lib/rancher
    environment:
      CATTLE_BOOTSTRAP_PASSWORD: ${RANCHER_BOOTSTRAP_PASSWORD:-admin12345}

volumes:
  rancher-data:
