apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-api-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nghiabka/rancher-platform-template.git
    targetRevision: main
    path: gitops/apps/sample-api/overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: sample-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
