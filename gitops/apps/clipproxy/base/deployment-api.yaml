apiVersion: apps/v1
kind: Deployment
metadata:
  name: clipproxy-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clipproxy
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clipproxy
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: clipproxy-api
          image: eceasy/cli-proxy-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8317
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /CLIProxyAPI/config.yaml
              subPath: config.yaml
            - name: data
              mountPath: /root/.cli-proxy-api
      volumes:
        - name: config
          configMap:
            name: clipproxy-config
        - name: data
          persistentVolumeClaim:
            claimName: clipproxy-api-data
