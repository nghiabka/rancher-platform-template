apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 9router
spec:
  ingressClassName: nginx
  rules:
    - host: 9router.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: 9router
                port:
                  name: http
