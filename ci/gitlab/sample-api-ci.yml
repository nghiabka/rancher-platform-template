stages:
  - test
  - build
  - scan

variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/sample-api"
  IMAGE_TAG: "$CI_COMMIT_SHORT_SHA"

test:
  stage: test
  image: python:3.12-slim
  script:
    - cd apps/sample-api
    - pip install -r requirements.txt
    - python -m pytest

build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker build -t "$IMAGE_NAME:$IMAGE_TAG" apps/sample-api
    - docker push "$IMAGE_NAME:$IMAGE_TAG"

scan:
  stage: scan
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - trivy image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL "$IMAGE_NAME:$IMAGE_TAG"
